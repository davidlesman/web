<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Eitan Lesman | Imperial College London</title>
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <style>
    :root {
      --brg: #004225;
      --cream: #f9f9f7;
      --ink: #1a1a1a;
      --thickness: 5px;
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      line-height: 1.5;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      background-color: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation / Logo Area */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .logo {
      height: 50px;
      width: auto;
    }

    header {
      border-top: var(--thickness) solid var(--brg);
      border-bottom: var(--thickness) solid var(--brg);
      padding: 2rem 0;
      margin-bottom: 3.5rem;
    }

    h1 {
      font-size: 3.5rem;
      margin: 0;
      letter-spacing: -2px;
      line-height: 1;
      text-transform: uppercase;
      font-weight: 900;
      font-style: italic;
      font-family: 'Georgia';
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--brg);
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Section Styling */
    section {
      margin-bottom: 4rem;
    }

    h2 {
      font-size: 1.5rem;
      text-transform: uppercase;
      font-weight: 800;
      border-left: 8px solid var(--brg);
      padding-left: 1rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      font-family: 'Georgia';
    }

    .summary-text {
      font-size: 1.4rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ink);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
    }

    .btn {
      display: inline-block;
      background: var(--brg);
      color: white;
      padding: 1rem 2rem;
      text-decoration: none;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      margin-top: 6rem;
      border-top: 15px solid var(--brg);
      padding: 2.5rem 0 4rem;
    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      font-weight: 900;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }

    .footer-links a:hover {
      border-bottom: 2px solid var(--brg);
    }

    .stamp {
      background: var(--brg);
      color: var(--cream);
      padding: 1.2rem 1.8rem;
      text-align: right;
      box-sizing: border-box;
      max-width: 100%;
    }

    .stamp .latin {
      display: block;
      font-family: 'Georgia', serif;
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 900;
      line-height: 1.2;
    }

    .stamp .sub {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 5px;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .footer-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links {
        flex-direction: column;
        gap: 1.2rem;
      }

      .stamp {
        width: 100%;
        text-align: left;
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
